[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-config-linter"
version = "0.1.0"
description = "Lint GitHub Actions workflows for security issues, unpinned actions and missing caches"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML==6.0.1"]

[project.scripts]
ci-lint = "ci_linter.cli:main"

[tool.setuptools]
packages = ["ci_linter"]
